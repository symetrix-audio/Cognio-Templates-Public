<!doctype html>
<!--
  Cognio Public Template Library
  ------------------------------
  A single, dependency-free page that lists every released Cognio template
  (sites, spaces, themes, module configurations). It fetches ./index.json
  (regenerated by the release pipeline in the private Cognio-Templates repo)
  and renders a filterable catalog with download links. No build step, no
  frameworks, no external requests — safe to serve straight from GitHub Pages.

  Layout and styling deliberately mirror the Cognio Driver Library page in
  symetrix-audio/cognio-drivers-public so the two sites look and behave alike.
-->
<title>Cognio Template Library</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Browse and download Cognio templates.">
<style>
  :root {
    --bg: #f4f6f8;
    --panel: #ffffff;
    --ink: #1c2733;
    --muted: #61707e;
    --line: #dfe5ea;
    --accent: #0a66c2;
    --accent-ink: #ffffff;
    --chip: #eef2f6;
    --shadow: 0 1px 3px rgba(18, 38, 58, .08), 0 1px 2px rgba(18, 38, 58, .06);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--ink);
    background: var(--bg);
    line-height: 1.5;
  }
  a { color: var(--accent); }

  header.site {
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    padding: 22px 28px;
  }
  header.site h1 { margin: 0; font-size: 22px; letter-spacing: .2px; }
  header.site p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }

  .layout {
    display: grid;
    grid-template-columns: 260px 1fr;
    gap: 24px;
    max-width: 1180px;
    margin: 0 auto;
    padding: 24px 28px 60px;
  }

  /* ---- Sidebar / filters ---- */
  aside { position: sticky; top: 24px; align-self: start; }
  .search {
    width: 100%;
    padding: 10px 12px;
    font-size: 14px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--panel);
    margin-bottom: 18px;
  }
  .search:focus { outline: 2px solid var(--accent); border-color: var(--accent); }

  .filter-group {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    margin-bottom: 16px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .filter-group h2 {
    margin: 0;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: .8px;
    color: #fff;
    background: #2b3947;
    padding: 10px 14px;
  }
  .filter-list { max-height: 260px; overflow-y: auto; padding: 8px 6px; }
  .filter-list label {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 8px;
    border-radius: 6px;
    font-size: 14px;
    cursor: pointer;
  }
  .filter-list label:hover { background: var(--chip); }
  .filter-list input { accent-color: var(--accent); width: 15px; height: 15px; }
  .filter-list .count { margin-left: auto; color: var(--muted); font-size: 12px; }
  .clear-all {
    background: none; border: none; color: var(--accent);
    font-size: 13px; cursor: pointer; padding: 4px 2px; margin-bottom: 12px;
  }
  .clear-all:hover { text-decoration: underline; }

  /* ---- Results ---- */
  .results-head {
    display: flex; align-items: baseline; justify-content: space-between;
    margin-bottom: 14px;
  }
  .results-head .count { color: var(--muted); font-size: 14px; }

  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 18px 20px;
    margin-bottom: 14px;
    box-shadow: var(--shadow);
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 6px 18px;
  }
  .card .title { grid-column: 1; margin: 0; font-size: 18px; }
  .card .author { grid-column: 1; color: var(--muted); font-size: 13px; margin: 0 0 6px; }
  .card .desc { grid-column: 1; margin: 6px 0 0; font-size: 14px; }
  .shot { grid-column: 1; margin: 12px 0 0; }
  .shot img {
    max-width: 220px; max-height: 140px; width: auto; height: auto;
    display: block; object-fit: contain; background: #fff;
    border: 1px solid var(--line); border-radius: 8px;
    padding: 4px; cursor: zoom-in; transition: border-color .12s;
  }
  .shot img:hover { border-color: var(--accent); }

  /* ---- Lightbox (click a preview image to enlarge) ---- */
  .lightbox {
    position: fixed; inset: 0; z-index: 100;
    display: none; align-items: center; justify-content: center;
    padding: 24px; background: rgba(12, 24, 36, .82); cursor: zoom-out;
  }
  .lightbox.open { display: flex; }
  .lightbox img {
    max-width: 92vw; max-height: 92vh; width: auto; height: auto;
    border-radius: 10px; box-shadow: 0 12px 48px rgba(0, 0, 0, .45);
    background: #fff;
  }
  .badges { grid-column: 1; display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
  .badge {
    font-size: 12px; padding: 2px 9px; border-radius: 999px;
    background: var(--chip); color: #33475b; white-space: nowrap;
  }
  .badge.ver { background: #eef2f6; color: #33475b; }
  .badge.type-site { background: #e4eefb; color: #0a4f9c; }
  .badge.type-space { background: #e2f3e8; color: #1c6b3a; }
  .badge.type-theme { background: #ece4fb; color: #5b2fa0; }
  .badge.type-module-configuration { background: #fdefdc; color: #8a5a12; }

  .dl {
    grid-column: 2; grid-row: 1 / span 2; align-self: center;
    display: inline-flex; align-items: center; justify-content: center;
    background: var(--accent); color: var(--accent-ink);
    text-decoration: none; font-weight: 600; font-size: 14px;
    padding: 10px 18px; border-radius: 8px; white-space: nowrap;
  }
  .dl:hover { background: #08528f; }

  .empty, .error {
    background: var(--panel); border: 1px dashed var(--line);
    border-radius: 12px; padding: 40px 24px; text-align: center; color: var(--muted);
  }
  .error { border-color: #e4b4b4; color: #9c3a3a; }

  footer.site { text-align: center; color: var(--muted); font-size: 13px; padding: 0 0 40px; }

  @media (max-width: 760px) {
    .layout { grid-template-columns: 1fr; }
    aside { position: static; }
    .card { grid-template-columns: 1fr; }
    .dl { grid-column: 1; grid-row: auto; justify-self: start; margin-top: 10px; }
  }
</style>

<header class="site">
  <h1>Cognio Template Library</h1>
  <p>Browse and download sites, spaces, themes and module configurations for Cognio-powered systems.</p>
</header>

<div class="layout">
  <aside>
    <input id="search" class="search" type="search" placeholder="Search templates…" aria-label="Search templates">
    <button id="clearAll" class="clear-all" hidden>Clear all filters</button>
    <div id="filters"></div>
  </aside>

  <main>
    <div class="results-head">
      <div class="count" id="count"></div>
    </div>
    <div id="results"></div>
  </main>
</div>

<footer class="site">
  Cognio Template Library · templates are provided as <code>.cogsite</code>, <code>.cogtheme</code> and other Cognio export files.
</footer>

<!-- Full-size preview overlay. Hidden until a card thumbnail is clicked. -->
<div class="lightbox" id="lightbox" aria-hidden="true">
  <img id="lightboxImg" src="" alt="">
</div>

<script>
(function () {
  "use strict";

  // Facets shown as checkbox groups. `key` is the template field; `label` the
  // group heading. Same sidebar pattern as the Cognio Driver Library.
  var FACETS = [
    { id: "type",   key: "type",   label: "Template type" },
    { id: "author", key: "author", label: "Author" }
  ];

  // Friendly labels for the `type` values written by the release pipeline
  // (see TEMPLATE_TYPES in Cognio-Templates/scripts/templates.mjs). An unknown
  // future type still renders, just with its raw value.
  var TYPE_LABEL = {
    "site": "Site",
    "space": "Space",
    "theme": "Theme",
    "module-configuration": "Module configuration"
  };

  var state = {
    all: [],                                   // every template from index.json
    search: "",
    selected: { type: new Set(), author: new Set() }
  };

  var elFilters = document.getElementById("filters");
  var elResults = document.getElementById("results");
  var elCount = document.getElementById("count");
  var elSearch = document.getElementById("search");
  var elClear = document.getElementById("clearAll");

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function typeLabel(t) {
    return TYPE_LABEL[t] || t || "";
  }

  // ---- data load ----
  fetch("./index.json", { cache: "no-cache" })
    .then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    })
    .then(function (data) {
      state.all = Array.isArray(data && data.templates) ? data.templates : [];
      buildFilters();
      render();
    })
    .catch(function () {
      // A missing index.json (before the first release) is an expected state,
      // not an error — show the friendly empty message.
      state.all = [];
      buildFilters();
      render();
    });

  // ---- filters ----
  function optionsFor(key) {
    var counts = {};
    state.all.forEach(function (d) {
      var v = d[key];
      if (v == null || v === "") return;
      counts[v] = (counts[v] || 0) + 1;
    });
    return Object.keys(counts).sort(function (a, b) {
      return a.localeCompare(b);
    }).map(function (v) { return { value: v, count: counts[v] }; });
  }

  function buildFilters() {
    elFilters.innerHTML = "";
    FACETS.forEach(function (facet) {
      var opts = optionsFor(facet.key);
      if (!opts.length) return; // hide a facet with no data yet
      var group = document.createElement("div");
      group.className = "filter-group";
      var h = document.createElement("h2");
      h.textContent = facet.label;
      group.appendChild(h);

      var list = document.createElement("div");
      list.className = "filter-list";

      // "All" pseudo-option: checked when nothing specific is selected.
      list.appendChild(makeRow(facet, null, "All", state.all.length));
      opts.forEach(function (o) {
        var display = facet.key === "type" ? typeLabel(o.value) : o.value;
        list.appendChild(makeRow(facet, o.value, display, o.count));
      });
      group.appendChild(list);
      elFilters.appendChild(group);
    });
  }

  function makeRow(facet, value, display, count) {
    var label = document.createElement("label");
    var cb = document.createElement("input");
    cb.type = "checkbox";
    var set = state.selected[facet.id];
    cb.checked = value === null ? set.size === 0 : set.has(value);
    cb.addEventListener("change", function () {
      if (value === null) {
        set.clear();                 // "All" resets the group
      } else if (cb.checked) {
        set.add(value);
      } else {
        set.delete(value);
      }
      buildFilters();                // re-sync checkbox states (incl. "All")
      render();
    });
    var span = document.createElement("span");
    span.textContent = display;
    var c = document.createElement("span");
    c.className = "count";
    c.textContent = count;
    label.appendChild(cb);
    label.appendChild(span);
    label.appendChild(c);
    return label;
  }

  // ---- rendering ----
  function matches(d) {
    for (var i = 0; i < FACETS.length; i++) {
      var f = FACETS[i];
      var set = state.selected[f.id];
      if (set.size && !set.has(d[f.key])) return false;   // AND across groups
    }
    if (state.search) {
      var hay = (d.name + " " + typeLabel(d.type) + " " + (d.author || "") + " " +
        (d.description || "")).toLowerCase();
      if (hay.indexOf(state.search) === -1) return false;
    }
    return true;
  }

  function anyFilterActive() {
    return state.search !== "" ||
      FACETS.some(function (f) { return state.selected[f.id].size > 0; });
  }

  function render() {
    elClear.hidden = !anyFilterActive();

    if (!state.all.length) {
      elResults.innerHTML = '<div class="empty">No templates are available yet — ' +
        'new templates are published here as they are released. Check back soon.</div>';
      elCount.textContent = "";
      return;
    }

    var list = state.all.filter(matches);
    elCount.textContent = list.length + (list.length === 1 ? " template" : " templates");

    if (!list.length) {
      elResults.innerHTML = '<div class="empty">No templates match your filters.</div>';
      return;
    }
    elResults.innerHTML = list.map(cardHtml).join("");
  }

  function cardHtml(d) {
    var fileName = String(d.path || d.downloadUrl || "").split("/").pop() || "template";

    var dl = d.downloadUrl
      ? '<a class="dl" href="' + esc(d.downloadUrl) + '" download="' + esc(fileName) +
        '" rel="noopener">Download</a>'
      : "";

    // Preview image (optional): a medium thumbnail the visitor can click to
    // open full size in the lightbox. The release pipeline only emits imageUrl
    // when the image actually shipped, so an absent imageUrl -> no thumbnail.
    // onerror guards the rare case of a URL that 404s.
    var shot = d.imageUrl
      ? '<div class="shot"><img src="' + esc(d.imageUrl) +
        '" alt="' + esc((d.name || "template") + " preview") + '" loading="lazy" ' +
        'onerror="this.closest(\'.shot\').remove()"></div>'
      : "";

    // Class names come from a fixed set; anything unexpected falls back to the
    // plain badge style rather than being injected into the class attribute.
    var typeClass = TYPE_LABEL[d.type] ? " type-" + d.type : "";

    return '<article class="card">' +
      '<h3 class="title">' + esc(d.name || "Unnamed template") + '</h3>' +
      (d.author ? '<p class="author">by ' + esc(d.author) + '</p>' : "") +
      '<div class="badges">' +
        (d.type ? '<span class="badge' + typeClass + '">' + esc(typeLabel(d.type)) + '</span>' : "") +
        (d.version ? '<span class="badge ver">v' + esc(d.version) + '</span>' : "") +
      '</div>' +
      (d.description ? '<p class="desc">' + esc(d.description) + '</p>' : "") +
      shot +
      dl +
    '</article>';
  }

  // ---- lightbox ----
  var elLightbox = document.getElementById("lightbox");
  var elLightboxImg = document.getElementById("lightboxImg");

  function openLightbox(src, alt) {
    elLightboxImg.src = src;
    elLightboxImg.alt = alt || "";
    elLightbox.classList.add("open");
    elLightbox.setAttribute("aria-hidden", "false");
  }
  function closeLightbox() {
    elLightbox.classList.remove("open");
    elLightbox.setAttribute("aria-hidden", "true");
    elLightboxImg.src = "";           // release the full-size image
  }

  // Delegate: a click on any preview thumbnail opens it full size.
  elResults.addEventListener("click", function (e) {
    var img = e.target.closest(".shot img");
    if (img) openLightbox(img.src, img.alt);
  });
  elLightbox.addEventListener("click", closeLightbox);
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") closeLightbox();
  });

  elSearch.addEventListener("input", function () {
    state.search = elSearch.value.trim().toLowerCase();
    render();
  });

  elClear.addEventListener("click", function () {
    state.search = "";
    elSearch.value = "";
    FACETS.forEach(function (f) { state.selected[f.id].clear(); });
    buildFilters();
    render();
  });
})();
</script>
